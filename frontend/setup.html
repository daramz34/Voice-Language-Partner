<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New session — Voice Language Partner</title>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span>Voice Language Partner</a>
      <nav class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 style="font-size:24px; letter-spacing:-0.02em;">Set up your session</h1>
        <p class="muted" style="margin-bottom:24px;">Pick how you want to practice today.</p>
        <form id="setup-form">
          <label class="field"><span>I'm practicing</span>
            <select name="target_language">
              <option value="spanish">Spanish</option><option value="french">French</option>
              <option value="german">German</option><option value="italian">Italian</option>
              <option value="portuguese">Portuguese</option>
            </select></label>
          <label class="field"><span>My level</span>
            <select name="proficiency_level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select></label>
          <label class="field"><span>Mode</span>
            <select name="practice_mode" id="mode-select">
              <option value="free_conversation">Free conversation</option>
              <option value="scenario">Scenario</option>
              <option value="tutor">Tutor</option>
              <option value="vocabulary">Vocabulary</option>
            </select></label>
                    <label class="field" id="scenario-field" hidden><span>Scenario</span>
            <select name="scenario_type">
              <option value="restaurant">Restaurant</option>
              <option value="airport">Airport</option>
              <option value="hotel">Hotel</option>
              <option value="shopping">Shopping</option>
              <option value="job_interview">Job interview</option>
              <option value="directions">Asking for directions</option>
            </select></label>

          <label class="field" id="topic-field" hidden><span>Topic / word list</span>
            <input type="text" name="topic" placeholder="e.g. travel, food, 10 kitchen words"></label>
          <p class="form-error" id="setup-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="setup-btn">Start session</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if (!API.token) window.location.href = "/auth.html";
    const $ = (id) => document.getElementById(id);

    $("mode-select").addEventListener("change", (e) => {
      const m = e.target.value;
      $("scenario-field").hidden = m !== "scenario";
      $("topic-field").hidden = !(m === "free_conversation" || m === "vocabulary");
    });

    $("setup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("setup-error"), btn = $("setup-btn");
      err.hidden = true; btn.disabled = true; btn.textContent = "Creating...";
      const f = new FormData(e.target);
      const g = (k) => f.get(k) || null;
      try {
        const session = await API.createSession({
          target_language: g("target_language"),
          support_language: "english",
          conversation_config: "support_target",
          practice_mode: g("practice_mode"),
          proficiency_level: g("proficiency_level"),
          scenario_type: g("scenario_type"),
          topic: g("topic"),
        });
        window.location.href = `/practice.html?id=${session.id}`;
      } catch (ex) {
        err.textContent = ex.message; err.hidden = false;
        btn.disabled = false; btn.textContent = "Start session";
      }
    });
  </script>
</body>
</html>
