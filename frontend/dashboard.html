<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Voice Language Partner</title>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");</script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .dash-wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px; }
    .dash-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .dash-head h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .lang-card { border: 1px solid rgba(128,128,128,.3); border-radius: 12px; padding: 18px 20px; }
    .lang-card h2 { margin: 0 0 8px; font-size: 16px; }
    .lang-score { font-size: 34px; font-weight: 800; line-height: 1; margin-bottom: 12px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; opacity: .85; }
    .stat-row b { font-weight: 700; }
    .lang-bar { height: 6px; border-radius: 3px; background: rgba(128,128,128,.25); margin-top: 12px; overflow: hidden; }
    .lang-bar i { display: block; height: 100%; background: currentColor; border-radius: 3px; }
    .section-title { font-size: 18px; margin: 0 0 12px; }
    .dash-table-wrap { border: 1px solid rgba(128,128,128,.3); border-radius: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .dash-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
    .dash-table th, .dash-table td { text-align: left; padding: 12px 16px; border-bottom: 1px solid rgba(128,128,128,.2); }
    .dash-table th { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .6; }
    .dash-table tr:last-child td { border-bottom: none; }
    .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
    .badge.completed { background: rgba(30,126,52,.15); color: #1e7e34; }
    .badge.active { background: rgba(57,35,199,.12); color: #3923c7; }
    .badge.failed { background: rgba(240,68,56,.12); color: #f04438; }
    .dash-table a { font-weight: 600; }
    .score-cell { font-weight: 700; }
    .mistake-card { border: 1px solid rgba(128,128,128,.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; font-size: 14px; }
    .mistake-card .explanation { opacity: .75; margin-top: 4px; }
    .empty-note { opacity: .6; font-size: 14px; padding: 20px 0; }
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .dash-table { min-width: 560px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span>Voice Language Partner</a>
      <nav class="nav-links">
        <a class="btn btn-primary" href="/setup.html" style="margin-right:8px;">New session</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="dash-wrap">
    <div class="dash-head"><h1>Your progress</h1></div>

    <div class="cards" id="cards"></div>

    <h2 class="section-title">Session history</h2>
    <div class="dash-table-wrap">
      <table class="dash-table">
        <thead>
          <tr>
            <th>Session</th><th>Language</th><th>Mode</th><th>When</th><th>Status</th><th>Score</th><th></th>
          </tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </div>

    <h2 class="section-title" style="margin-top:32px;">Recent mistakes</h2>
    <div id="mistakes"></div>

    <p class="form-error" id="dash-error" hidden style="margin-top:16px;"></p>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if (!API.token) window.location.href = "/auth.html";
    const $ = (id) => document.getElementById(id);

    function fail(msg) { const e = $("dash-error"); e.textContent = msg; e.hidden = false; }

    function fmtWhen(iso) {
      try { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
      catch { return iso || "—"; }
    }
    function fmtScore(v) { return (v === null || v === undefined) ? "—" : Number(v).toFixed(0); }

    (async () => {
      try {
        const sessions = await fetch(`/api/v1/session/`, { headers: API.headers() })
          .then(r => { if (!r.ok) throw new Error("Could not load sessions"); return r.json(); });
        const list = (sessions.results || []).slice().sort((a, b) => a.id - b.id);

        // ---- per-user ordinal numbering: #1 = user's 1st session ever ----
        const ordinal = new Map(list.map((s, i) => [s.id, i + 1]));

        // ---- per-language cards ----
        const byLang = {};
        for (const s of list) {
          const lang = (s.target_language || "?").toLowerCase();
          byLang[lang] = byLang[lang] || { count: 0, best: null, days: new Set() };
          byLang[lang].count += 1;
          const sc = s.overall_score ?? s.evaluation?.overall_score ?? null;
          if (sc !== null && sc !== undefined) {
            byLang[lang].best = byLang[lang].best === null ? sc : Math.max(byLang[lang].best, sc);
          }
          if (s.created_at) byLang[lang].days.add(String(s.created_at).slice(0, 10));
        }

        $("cards").innerHTML = Object.entries(byLang).map(([lang, d]) => {
          const langName = lang.charAt(0).toUpperCase() + lang.slice(1);
          const best = d.best === null ? 0 : d.best;
          return `
            <div class="lang-card">
              <h2>${langName}</h2>
              <div class="lang-score">${fmtScore(d.best)}</div>
              <div class="stat-row"><span>Sessions</span><b>${d.count}</b></div>
              <div class="stat-row"><span>Best score</span><b>${fmtScore(d.best)}</b></div>
              <div class="stat-row"><span>Active days</span><b>${d.days.size}</b></div>
              <div class="lang-bar"><i style="width:${Math.max(0, Math.min(100, best))}%"></i></div>
            </div>`;
        }).join("") || `<p class="empty-note">No sessions yet — start your first one!</p>`;

        // ---- session history (newest first, but numbered per-user) ----
        const recent = list.slice().reverse();
        $("history").innerHTML = recent.map(s => `
          <tr>
            <td>#${ordinal.get(s.id)}</td>
            <td>${(s.target_language || "—").charAt(0).toUpperCase() + (s.target_language || "").slice(1)}</td>
            <td>${(s.practice_mode || "—").replace("_", " ")}</td>
            <td>${fmtWhen(s.created_at)}</td>
            <td><span class="badge ${s.status || "active"}">${s.status || "active"}</span></td>
            <td class="score-cell">${fmtScore(s.overall_score ?? s.evaluation?.overall_score)}</td>
            <td><a href="/report.html?id=${s.id}">View</a></td>
          </tr>`).join("") || `<tr><td colspan="7" class="empty-note">Nothing here yet.</td></tr>`;

        // ---- recent mistakes ----
        const mres = await fetch(`/api/v1/mistake/`, { headers: API.headers() });
        const mistakes = mres.ok ? await mres.json() : [];
        $("mistakes").innerHTML = mistakes.length
          ? mistakes.slice(0, 8).map(m => `
              <div class="mistake-card">
                <b>${m.original_text}</b> → ${m.corrected_text}
                <span class="badge ${m.mistake_type === "grammar" ? "failed" : "active"}" style="margin-left:8px;">${m.mistake_type}</span>
                <div class="explanation">${m.explanation || ""}</div>
              </div>`).join("")
          : `<p class="empty-note">No mistakes recorded — clean runs so far.</p>`;

      } catch (ex) {
        fail(ex.message || "Could not load dashboard");
      }
    })();
  </script>
</body>
</html>
