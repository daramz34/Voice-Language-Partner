<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session report — Voice Language Partner</title>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span>Voice Language Partner</a>
      <nav class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/setup.html">New session</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="report-page">
      <div class="demo-card">
        <div class="demo-head"><span class="demo-title" id="title">Session report</span></div>
        <div class="demo-body" id="scores"></div>
      </div>
      <div class="demo-card" style="margin-top:20px;">
        <div class="demo-head"><span class="demo-title">Mistakes to review</span></div>
        <div class="demo-body" id="mistakes" style="min-height:0;"></div>
      </div>
      <div style="display:flex; gap:12px; margin-top:24px;">
        <a class="btn btn-primary" id="again-btn" href="#">Practice again</a>
        <a class="btn btn-ghost" href="/dashboard.html">Back to dashboard</a>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if (!API.token) window.location.href = "/auth.html";
    const id = new URLSearchParams(window.location.search).get("id");
    const $ = (s) => document.querySelector(s);

    // "Practice again" re-enters this same session
    $("again-btn").href = `/practice.html?id=${id}`;

    function row(label, val) {
      return `<div class="score-row"><span>${label}</span>
        <div class="bar"><i style="width:${val}%"></i></div><b>${val}</b></div>`;
    }

    (async () => {
      const evals = await fetch(`/api/v1/session/${id}/evaluate`, { headers: API.headers() });
      const ev = await evals.json();
      if (!evals.ok) { $("#scores").innerHTML = `<p class="muted">${ev.detail || "Not evaluated yet"}</p>`; return; }

      $("#title").textContent = `Session report · Session #${ev.session_id}`;
      const fb = ev.feedback || {};
      $("#scores").innerHTML = `
        <div class="scorecard-head"><strong>Overall</strong><span class="score-big">${ev.overall_score}</span></div>
        ${row("grammar", ev.grammar_score)}
        ${row("vocabulary", ev.vocabulary_score)}
        ${row("fluency", ev.fluency_score)}
        ${row("comprehension", ev.comprehension_score)}
        ${row("target language %", ev.target_language_percentage)}
        ${fb.grammar ? `<div class="score-tip"><b>Grammar:</b> ${fb.grammar}</div>` : ""}
        ${fb.vocabulary ? `<div class="score-tip"><b>Vocabulary:</b> ${fb.vocabulary}</div>` : ""}
        ${fb.fluency ? `<div class="score-tip"><b>Fluency:</b> ${fb.fluency}</div>` : ""}
        ${ev.recommendation ? `<div class="score-tip"><b>Next:</b> ${ev.recommendation}</div>` : ""}`;

      // personalized next-step recommendation (generated live)
      const recEl = document.createElement("div");
      recEl.className = "score-tip";
      recEl.innerHTML = `<b>Coach says:</b> <span class="muted">thinking...</span>`;
      $("#scores").appendChild(recEl);
      try {
        const rec = await fetch(`/api/v1/session/${id}/recommendation`, { headers: API.headers() }).then(r => r.json());
        recEl.innerHTML = `<b>Coach says:</b> ${rec.recommendation}`;
      } catch {
        recEl.innerHTML = `<b>Coach says:</b> <span class="muted">Could not generate a recommendation.</span>`;
      }

      const mres = await fetch(`/api/v1/mistake/`, { headers: API.headers() });
      const mistakes = await mres.json();
      $("#mistakes").innerHTML = mistakes.length
        ? mistakes.map(m => `<div class="score-tip"><b>${m.original_text}</b> → ${m.corrected_text} <span class="muted">(${m.mistake_type}) ${m.explanation || ""}</span></div>`).join("")
        : `<p class="muted">No mistakes recorded — clean run.</p>`;
    })();
  </script>
</body>
</html>
