<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Voice Language Partner</title>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span>Voice Language Partner</a>
      <nav class="nav-links"><button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button></nav>
    </div>
  </header>

  <main class="page">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 style="font-size:24px; letter-spacing:-0.02em;">Welcome back</h1>
        <p class="muted" style="margin-bottom:20px;">Sign in to keep practicing.</p>

        <p class="form-error" id="expired-note" hidden style="margin-bottom:16px;">Your session expired — please sign in again.</p>

        <!-- shown when a token already exists -->
        <div id="already-in" hidden style="margin-bottom:20px;">
          <p style="margin-bottom:12px;">You're already signed in.</p>
          <div style="display:flex; gap:8px;">
            <a class="btn btn-primary" href="/dashboard.html">Go to dashboard</a>
            <button class="btn btn-ghost" id="logout-btn">Log out</button>
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:16px;" id="tabs">
          <button type="button" id="tab-login" class="btn btn-primary" style="flex:1;">Login</button>
          <button type="button" id="tab-register" class="btn btn-ghost" style="flex:1;">Register</button>
        </div>

        <form id="auth-form">
          <label class="field" id="username-field" hidden><span>Username</span>
            <input type="text" name="username" autocomplete="username"></label>
          <label class="field" id="email-field" hidden><span>Email</span>
            <input type="email" name="email" autocomplete="email"></label>
          <label class="field"><span id="pw-label">Username</span>
            <input type="text" name="login_username" id="login-username" autocomplete="username"></label>
          <label class="field"><span>Password</span>
            <input type="password" name="password" id="password" autocomplete="current-password" required></label>
          <p class="form-error" id="auth-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="auth-btn">Login</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // session-expired notice (set by api.js on 401)
    if (new URLSearchParams(location.search).get("expired")) $("expired-note").hidden = false;

    let mode = "login";

    // Already signed in? Show options instead of auto-redirect.
    if (API.token) {
      $("already-in").hidden = false;
      $("auth-form").hidden = true;
      $("tabs").hidden = true;
    }

    $("logout-btn").addEventListener("click", () => {
      API.clearToken();
      location.reload();
    });

    $("tab-login").addEventListener("click", () => setMode("login"));
    $("tab-register").addEventListener("click", () => setMode("register"));

    function setMode(m) {
      mode = m;
      $("tab-login").className = "btn " + (m === "login" ? "btn-primary" : "btn-ghost");
      $("tab-register").className = "btn " + (m === "register" ? "btn-primary" : "btn-ghost");
      // register shows username + email; login asks for username only
      $("username-field").hidden = m !== "register";
      $("email-field").hidden = m !== "register";
      $("login-username").closest(".field").hidden = m !== "login";
      $("pw-label").textContent = m === "login" ? "Username" : "Password";
      // move the password label properly: in register mode the standalone
      // username row hides, and password stays last
      $("auth-btn").textContent = m === "login" ? "Login" : "Create account";
      $("password").setAttribute("autocomplete", m === "login" ? "current-password" : "new-password");
      $("auth-error").hidden = true;
    }
    setMode("login");

    function showErr(msg) {
      const e = $("auth-error");
      e.textContent = msg; e.hidden = false;
    }

    $("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("auth-btn");
      $("auth-error").hidden = true;
      btn.disabled = true;
      const f = new FormData(e.target);

      try {
        if (mode === "register") {
          btn.textContent = "Creating account...";
          // native_language defaulted — your schema expects it
          await API.register({
            username: (f.get("username") || "").trim(),
            email: (f.get("email") || "").trim(),
            password: f.get("password"),
            native_language: "english",
          });
        }

        btn.textContent = "Signing in...";
        await API.login((f.get("login_username") || f.get("username") || "").trim(), f.get("password"));

        // success feedback, then straight to the dashboard
        btn.textContent = "✓ Signed in — opening dashboard...";
        setTimeout(() => { window.location.href = "/dashboard.html"; }, 600);

      } catch (ex) {
        // api.js already unwraps FastAPI's detail arrays into readable strings
        showErr(ex.message || "Something went wrong");
        btn.disabled = false;
        btn.textContent = mode === "login" ? "Login" : "Create account";
      }
    });
  </script>
</body>
</html>
