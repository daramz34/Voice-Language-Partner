<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Voice Language Partner</title>
  <meta name="description" content="Create an account or sign in to start practicing.">
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        Voice Language Partner
      </a>
      <nav class="nav-links">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="auth-wrap">
      <div class="auth-card">
        <p class="form-error" id="expired-banner" style="background:#fdf3e3; color:#92600a;" hidden>
          Your session expired. Sign in again to continue.
        </p>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login">Sign in</button>
          <button class="auth-tab" id="tab-register">Create account</button>
        </div>

        <!-- Login -->
        <form id="login-form" class="auth-form">
          <h1>Welcome back</h1>
          <p class="muted">Sign in to continue your practice.</p>

          <label class="field">
            <span>Username</span>
            <input type="text" name="username" required autocomplete="username">
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" required autocomplete="current-password">
          </label>

          <p class="form-error" id="login-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
        </form>

        <!-- Register -->
        <form id="register-form" class="auth-form" hidden>
          <h1>Create your account</h1>
          <p class="muted">One account, five languages, real conversations.</p>

          <label class="field">
            <span>Username</span>
            <input type="text" name="username" required minlength="3" autocomplete="username">
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
            <small class="muted">8–72 characters.</small>
          </label>
          <label class="field">
            <span>Your native language</span>
            <select name="native_language" required>
              <option value="english">English</option>
              <option value="spanish">Spanish</option>
              <option value="french">French</option>
              <option value="german">German</option>
              <option value="italian">Italian</option>
              <option value="portuguese">Portuguese</option>
            </select>
          </label>

          <p class="form-error" id="register-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create account</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // show "session expired" banner when redirected with ?expired=1
    if (new URLSearchParams(window.location.search).get("expired")) {
      document.getElementById("expired-banner").hidden = false;
    }

    // already signed in? skip the form
    if (API.token) window.location.href =  "/dashboard.html";

    const $ = (id) => document.getElementById(id);
    const tabLogin = $("tab-login"), tabRegister = $("tab-register");
    const formLogin = $("login-form"), formRegister = $("register-form");

    function showTab(which) {
      const isLogin = which === "login";
      tabLogin.classList.toggle("active", isLogin);
      tabRegister.classList.toggle("active", !isLogin);
      formLogin.hidden = !isLogin;
      formRegister.hidden = isLogin;
    }
    tabLogin.addEventListener("click", () => showTab("login"));
    tabRegister.addEventListener("click", () => showTab("register"));

    function showError(el, msg) { el.textContent = msg; el.hidden = false; }

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("login-error"), btn = $("login-btn");
      err.hidden = true;
      btn.disabled = true; btn.textContent = "Signing in...";
      try {
        const f = new FormData(formLogin);
        await API.login(f.get("username"), f.get("password"));
        window.location.href =  "/dashboard.html";
      } catch (ex) {
        showError(err, ex.message);
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });

    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("register-error"), btn = $("register-btn");
      err.hidden = true;
      btn.disabled = true; btn.textContent = "Creating account...";
      try {
        const f = new FormData(formRegister);
        await API.register({
          username: f.get("username"),
          email: f.get("email"),
          password: f.get("password"),
          native_language: f.get("native_language"),
        });
        // registered — now log in automatically
        await API.login(f.get("username"), f.get("password"));
        window.location.href = "/setup.html";
      } catch (ex) {
        showError(err, ex.message.replace(/^Value error, /, ""));
        btn.disabled = false; btn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
